name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar PowerShell (para validar instalar.ps1)
        uses: actions/setup-powershell@v1
        with:
          powershell-version: latest

      - name: Run de la suite de tests
        run: bash ./tests/run.sh